<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Agendar Cita</h2>

    <!-- nombre TEXT — solo letras y espacios, máx 100 -->
    <label>Nombre del Cliente <span style="color:#e74c3c">*</span></label>
    <input type="text" id="cita_cliente_nombre"
           maxlength="100"
           required
           pattern="[A-Za-záéíóúÁÉÍÓÚüÜñÑ\s]+"
           title="Solo se permiten letras y espacios"
           placeholder="Ej. Juan Pérez">

    <!-- telefono TEXT — solo dígitos, máx 15 -->
    <label>Teléfono del Cliente</label>
    <input type="tel" id="cita_cliente_telefono"
           maxlength="15"
           pattern="[0-9\-\+\s]+"
           title="Solo números, guiones y espacios"
           placeholder="Ej. 555-1234">

    <!-- idEmpleados INTEGER NOT NULL (seleccionado en select) -->
    <label>Barbero <span style="color:#e74c3c">*</span></label>
    <select id="cita_empleado" required>
        <option value="">Cargando barberos...</option>
    </select>

    <!-- fecha TEXT NOT NULL -->
    <label>Fecha <span style="color:#e74c3c">*</span></label>
    <input type="date" id="cita_fecha" required>

    <!-- hora TEXT NOT NULL -->
    <label>Hora <span style="color:#e74c3c">*</span></label>
    <input type="time" id="cita_hora" required>

    <div class="actions">
        <button onclick="guardarCita()">Registrar</button>
    </div>
</section>
<script src="../js/script.js"></script>
</body>
</html>
