<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Agendar Cita</h2>

    <label>Nombre del Cliente</label>
    <input type="text" id="cita_cliente_nombre" placeholder="Ej. Juan Pérez">

    <label>Teléfono del Cliente</label>
    <input type="text" id="cita_cliente_telefono" placeholder="Ej. 555-1234">

    <label>Barbero</label>
    <select id="cita_empleado">
        <option value="">Cargando barberos...</option>
    </select>

    <label>Fecha</label>
    <input type="date" id="cita_fecha">

    <label>Hora</label>
    <input type="time" id="cita_hora">

    <div class="actions">
        <button onclick="guardarCita()">Registrar</button>
    </div>
</section>
<script src="../js/script.js"></script>
</body>
</html>
