<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Empleados</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Gestión de Empleados</h2>

    <!-- nombre TEXT — solo letras y espacios, máx 50 -->
    <label>Nombre <span style="color:#e74c3c">*</span></label>
    <input type="text" id="emp_nombre"
           maxlength="50"
           required
           pattern="[A-Za-záéíóúÁÉÍÓÚüÜñÑ\s]+"
           title="Solo se permiten letras y espacios"
           placeholder="Nombre(s) del empleado">

    <!-- salario — campo extra, no en BD directamente, lo ignoramos en POST -->
    <label>Salario</label>
    <input type="number" id="emp_salario"
           min="0" max="999999"
           step="0.01"
           placeholder="Ej. 5000.00">

    <!-- usuario TEXT NOT NULL UNIQUE — máx 50, sin espacios -->
    <label>Usuario <span style="color:#e74c3c">*</span></label>
    <input type="text" id="emp_usuario"
           maxlength="50"
           required
           pattern="[A-Za-z0-9_\-]+"
           title="Solo letras, números, guion y guion bajo. Sin espacios."
           placeholder="usuario_unico"
           oninput="verificarUsuarioDisponible(this.value)">
    <small id="usuario_feedback" style="display:block; margin-top:2px; font-size:12px;"></small>

    <!-- contrasena TEXT NOT NULL — máx 100 -->
    <label>Contraseña <span style="color:#e74c3c">*</span></label>
    <input type="password" id="emp_contrasena"
           maxlength="100"
           required
           minlength="4"
           placeholder="Mínimo 4 caracteres">

    <!-- rol TEXT -->
    <label>Rol</label>
    <select id="emp_rol">
        <option value="Barbero">Barbero</option>
        <option value="Dueño">Dueño</option>
    </select>

    <div class="actions">
        <button onclick="guardarEmpleado()">Guardar</button>
    </div>

    <!-- TABLA DE EMPLEADOS -->
    <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 10px;">Lista de Personal</h3>
    <table style="width: 100%; border-collapse: collapse; margin-top: 15px;" id="tabla_empleados">
        <thead>
            <tr style="background-color: #333;">
                <th style="padding: 10px; border: 1px solid #555;">Nombre</th>
                <th style="padding: 10px; border: 1px solid #555;">Rol</th>
                <th style="padding: 10px; border: 1px solid #555;">Usuario</th>
                <th style="padding: 10px; border: 1px solid #555;">Salario ($)</th>
                <th style="padding: 10px; border: 1px solid #555;">Estado</th>
                <th style="padding: 10px; border: 1px solid #555;">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Las filas se cargarán aquí -->
        </tbody>
    </table>
</section>

<!-- Modal Editar Empleado -->
<div id="modalEditarEmpleado" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#222; padding:20px; border-radius:8px; width:90%; max-width:400px; color: white;">
        <h3 style="margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px;">Editar Empleado #<span id="edit_emp_id_display"></span></h3>
        <input type="hidden" id="edit_emp_id">
        
        <label style="display:block; margin-top:10px;">Nombre</label>
        <input type="text" id="edit_emp_nombre" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;" required>
        
        <label style="display:block; margin-top:10px;">Usuario</label>
        <input type="text" id="edit_emp_usuario" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;" required>
        
        <label style="display:block; margin-top:10px;">Salario ($)</label>
        <input type="number" id="edit_emp_salario" step="0.01" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;" required>
        
        <label style="display:block; margin-top:10px;">Rol</label>
        <select id="edit_emp_rol" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;">
            <option value="Barbero">Barbero</option>
            <option value="Dueño">Dueño</option>
        </select>
        
        <div class="actions" style="margin-top: 20px; display:flex; gap:10px;">
            <button onclick="actualizarEmpleado()" style="flex:1;">Actualizar</button>
            <button onclick="document.getElementById('modalEditarEmpleado').style.display='none'" style="flex:1; background:#555;">Cancelar</button>
        </div>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
