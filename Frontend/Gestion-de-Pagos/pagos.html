<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pagos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Gestionar Pagos</h2>

    <label>ID Cita</label>
    <input type="text" id="pago_cita">

    <label>Monto</label>
    <input type="text" id="pago_monto">

    <label>Método de Pago</label>
    <select id="pago_metodo">
        <option value="Efectivo">Efectivo</option>
        <option value="Tarjeta">Tarjeta</option>
    </select>

    <div class="actions">
        <button onclick="guardarPago()">Registrar Pago</button>
    </div>
</section>
<script src="../js/script.js"></script>
</body>
</html>
