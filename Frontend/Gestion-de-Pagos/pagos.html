<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pagos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Gestionar Pagos</h2>

    <!-- idCitas INTEGER NOT NULL -->
    <label>ID Cita <span style="color:#e74c3c">*</span></label>
    <input type="number" id="pago_cita"
           min="1" max="9999999"
           step="1"
           required
           placeholder="Número de ID de la cita">

    <!-- monto REAL NOT NULL -->
    <label>Monto ($) <span style="color:#e74c3c">*</span></label>
    <input type="number" id="pago_monto"
           min="0.01" max="99999.99"
           step="0.01"
           required
           placeholder="Ej. 120.00">

    <!-- metodo_pago TEXT -->
    <label>Método de Pago</label>
    <select id="pago_metodo">
        <option value="Efectivo">Efectivo</option>
        <option value="Tarjeta">Tarjeta</option>
        <option value="Transferencia">Transferencia</option>
    </select>

    <div class="actions">
        <button onclick="guardarPago()">Registrar Pago</button>
    </div>
</section>
<script src="../js/script.js"></script>
</body>
</html>
