<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Promociones</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Gestión de Promociones y Estilos</h2>

    <!-- SECCIÓN DE PROMOCIONES -->
    <h3 style="border-bottom: 1px solid #444; padding-bottom: 5px;">Nueva Promoción</h3>
    <!-- nombre TEXT -->
    <label>Nombre de la Promoción <span style="color:#e74c3c">*</span></label>
    <input type="text" id="promo_nombre" maxlength="100" required placeholder="Ej. Descuento de Verano">

    <!-- descripcion TEXT -->
    <label>Descripción</label>
    <input type="text" id="promo_descripcion" maxlength="200" placeholder="Ej. 10% en cortes seleccionados">

    <!-- descuento REAL NOT NULL -->
    <label>Descuento (%) <span style="color:#e74c3c">*</span></label>
    <input type="number" id="promo_descuento" min="0" max="100" step="0.01" required placeholder="Ej. 10">

    <!-- fecha_inicio TEXT, fecha_fin TEXT -->
    <label>Fecha de Inicio <span style="color:#e74c3c">*</span></label>
    <input type="date" id="promo_inicio" required>

    <label>Fecha de Fin <span style="color:#e74c3c">*</span></label>
    <input type="date" id="promo_fin" required>

    <div class="actions">
        <button onclick="guardarPromocion()">Guardar Promoción</button>
    </div>

    <!-- TABLA DE PROMOCIONES -->
    <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 10px;">Promociones Registradas</h3>
    <table style="width: 100%; border-collapse: collapse; margin-top: 15px;" id="tabla_promociones">
        <thead>
            <tr style="background-color: #333;">
                <th style="padding: 10px; border: 1px solid #555;">ID</th>
                <th style="padding: 10px; border: 1px solid #555;">Nombre</th>
                <th style="padding: 10px; border: 1px solid #555;">Descuento (%)</th>
                <th style="padding: 10px; border: 1px solid #555;">Vigencia</th>
                <th style="padding: 10px; border: 1px solid #555;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla_promociones_body">
            <!-- Las filas se cargarán aquí -->
        </tbody>
    </table>

    <!-- SECCIÓN DE ESTILOS -->
    <h3 style="margin-top: 50px; border-bottom: 1px solid #444; padding-bottom: 5px;">Nuevo Estilo / Corte</h3>
    
    <label>Nombre del Estilo <span style="color:#e74c3c">*</span></label>
    <input type="text" id="estilo_nombre" maxlength="100" required placeholder="Ej. Corte Clásico">

    <label>Descripción</label>
    <input type="text" id="estilo_descripcion" maxlength="200" placeholder="Ej. Corte a tijera con desvanecido">

    <label>Precio ($) <span style="color:#e74c3c">*</span></label>
    <input type="number" id="estilo_precio" min="0.01" max="99999.99" step="0.01" required placeholder="Ej. 150.00">

    <div class="actions">
        <button onclick="guardarEstilo()">Guardar Estilo</button>
    </div>

    <!-- TABLA DE ESTILOS -->
    <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 10px;">Catálogo de Estilos</h3>
    <table style="width: 100%; border-collapse: collapse; margin-top: 15px;" id="tabla_estilos">
        <thead>
            <tr style="background-color: #333;">
                <th style="padding: 10px; border: 1px solid #555;">ID</th>
                <th style="padding: 10px; border: 1px solid #555;">Nombre</th>
                <th style="padding: 10px; border: 1px solid #555;">Descripción</th>
                <th style="padding: 10px; border: 1px solid #555;">Precio ($)</th>
                <th style="padding: 10px; border: 1px solid #555;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla_estilos_body">
            <!-- Las filas se cargarán aquí -->
        </tbody>
    </table>
</section>

<!-- Modal Editar Promoción -->
<div id="modalEditarPromocion" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#222; padding:20px; border-radius:8px; width:90%; max-width:400px; color: white;">
        <h3 style="margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px;">Editar Promoción #<span id="edit_promo_id_display"></span></h3>
        <input type="hidden" id="edit_promo_id">
        
        <label style="display:block; margin-top:10px;">Nombre</label>
        <input type="text" id="edit_promo_nombre" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;" required>
        
        <label style="display:block; margin-top:10px;">Descripción</label>
        <input type="text" id="edit_promo_descripcion" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;">
        
        <label style="display:block; margin-top:10px;">Descuento (%)</label>
        <input type="number" id="edit_promo_descuento" step="0.01" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;" required>
        
        <label style="display:block; margin-top:10px;">Fecha Inicio</label>
        <input type="date" id="edit_promo_inicio" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;" required>
        
        <label style="display:block; margin-top:10px;">Fecha Fin</label>
        <input type="date" id="edit_promo_fin" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;" required>
        
        <div class="actions" style="margin-top: 20px; display:flex; gap:10px;">
            <button onclick="actualizarPromocion()" style="flex:1;">Actualizar</button>
            <button onclick="document.getElementById('modalEditarPromocion').style.display='none'" style="flex:1; background:#555;">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Editar Estilo -->
<div id="modalEditarEstilo" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#222; padding:20px; border-radius:8px; width:90%; max-width:400px; color: white;">
        <h3 style="margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px;">Editar Estilo #<span id="edit_estilo_id_display"></span></h3>
        <input type="hidden" id="edit_estilo_id">
        
        <label style="display:block; margin-top:10px;">Nombre</label>
        <input type="text" id="edit_estilo_nombre" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;" required>
        
        <label style="display:block; margin-top:10px;">Descripción</label>
        <input type="text" id="edit_estilo_descripcion" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;">
        
        <label style="display:block; margin-top:10px;">Precio ($)</label>
        <input type="number" id="edit_estilo_precio" step="0.01" style="width:100%; padding:8px; margin-top:5px; background:#333; color:white; border:1px solid #555;" required>
        
        <div class="actions" style="margin-top: 20px; display:flex; gap:10px;">
            <button onclick="actualizarEstilo()" style="flex:1;">Actualizar</button>
            <button onclick="document.getElementById('modalEditarEstilo').style.display='none'" style="flex:1; background:#555;">Cancelar</button>
        </div>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
