<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Promociones</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Gestionar Promociones</h2>

    <!-- nombre TEXT NOT NULL (validado en JS) — solo letras y espacios, máx 80 -->
    <label>Nombre promoción <span style="color:#e74c3c">*</span></label>
    <input type="text" id="prom_nombre"
           maxlength="80"
           required
           pattern="[A-Za-záéíóúÁÉÍÓÚüÜñÑ0-9\s\-]+"
           title="Solo letras, números, espacios y guiones"
           placeholder="Ej. Descuento de Verano">

    <!-- descuento REAL — número con decimales, rango 0-100 -->
    <label>Descuento (%) <span style="color:#e74c3c">*</span></label>
    <input type="number" id="prom_descuento"
           min="0.01" max="100"
           step="0.01"
           required
           placeholder="Ej. 15.00">

    <div class="actions">
        <button onclick="guardarPromocion()">Guardar</button>
    </div>
</section>
<script src="../js/script.js"></script>
</body>
</html>
