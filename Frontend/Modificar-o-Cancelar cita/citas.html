<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Cita</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Modificar o Cancelar Cita</h2>

    <label>Selecciona una Cita <span style="color:#e74c3c">*</span></label>
    <select id="lista_citas" required>
        <option value="">Cargando citas...</option>
    </select>

    <label style="margin-top: 20px;">Nueva Fecha <small style="color:#aaa">(solo para modificar)</small></label>
    <input type="date" id="mod_fecha">

    <label>Nueva Hora <small style="color:#aaa">(solo para modificar)</small></label>
    <input type="time" id="mod_hora">

    <div class="actions">
        <button onclick="modificarCita()">Modificar</button>
        <button onclick="cancelarCita()">Cancelar cita</button>
    </div>

    <!-- ══════════════════════════════════════════
         TABLA DE CITAS REGISTRADAS
    ══════════════════════════════════════════ -->
    <h3 style="margin-top:40px; border-bottom:1px solid #444; padding-bottom:10px;">
        📋 Citas Registradas
    </h3>

    <!-- Filtro por fecha -->
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
        <label style="margin:0;">Filtrar por fecha:</label>
        <input type="date" id="filtro_fecha"
               style="width:auto;"
               onchange="filtrarCitasPorFecha()">
        <button onclick="limpiarFiltro()"
                style="padding:6px 14px; font-size:13px; background:#555; border:none; color:#fff; border-radius:4px; cursor:pointer;">
            Ver todas
        </button>
        <span id="resumen_citas" style="margin-left:auto; font-size:13px; color:#aaa;"></span>
    </div>

    <!-- Tabla -->
    <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse;" id="tabla_citas">
            <thead>
                <tr style="background-color:#333;">
                    <th style="padding:10px; border:1px solid #555; text-align:left;">#</th>
                    <th style="padding:10px; border:1px solid #555; text-align:left;">Cliente</th>
                    <th style="padding:10px; border:1px solid #555; text-align:left;">Barbero</th>
                    <th style="padding:10px; border:1px solid #555; text-align:left;">Fecha</th>
                    <th style="padding:10px; border:1px solid #555; text-align:left;">Hora</th>
                    <th style="padding:10px; border:1px solid #555; text-align:left;">Estado</th>
                </tr>
            </thead>
            <tbody id="tabla_citas_body">
                <tr>
                    <td colspan="6" style="padding:20px; text-align:center; color:#aaa; border:1px solid #555;">
                        Cargando citas...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</section>
<script src="../js/script.js"></script>
</body>
</html>
