<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Cita</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Modificar o Cancelar Cita</h2>

    <select id="lista_citas">
        <option value="">Cargando citas...</option>
    </select>

    <label style="margin-top: 20px;">Nueva Fecha (Solo para modificar)</label>
    <input type="date" id="mod_fecha">

    <label>Nueva Hora</label>
    <input type="time" id="mod_hora">

    <div class="actions">
        <button onclick="modificarCita()">Modificar</button>
        <button onclick="cancelarCita()">Cancelar</button>
    </div>
</section>
<script src="../js/script.js"></script>
</body>
</html>
