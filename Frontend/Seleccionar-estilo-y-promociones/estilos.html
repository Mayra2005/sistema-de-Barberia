<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Estilos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Seleccionar Estilo y Promociones</h2>

    <!-- idCitas INTEGER — selección requerida -->
    <label>Cita Pendiente <span style="color:#e74c3c">*</span></label>
    <select id="estilo_cita" required>
        <option value="">Cargando citas...</option>
    </select>

    <!-- idEstilos INTEGER — selección requerida -->
    <label>Estilo Aplicado <span style="color:#e74c3c">*</span></label>
    <select id="estilo_estilo" required>
        <option value="">Cargando estilos...</option>
    </select>

    <!-- idPromociones INTEGER — opcional -->
    <label>Promoción Aplicada <small style="color:#aaa">(opcional)</small></label>
    <select id="estilo_promocion">
        <option value="">Ninguna / Cargando...</option>
    </select>

    <div class="actions">
        <button onclick="asignarEstiloPromocion()">Guardar Cambios</button>
    </div>
</section>
<script src="../js/script.js"></script>
</body>
</html>
