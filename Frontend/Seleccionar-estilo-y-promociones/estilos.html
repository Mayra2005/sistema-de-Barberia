<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Estilos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarMenu()">

<header>
    <h1>Sistema de Barbería</h1>
    <p id="rolActual"></p>
</header>

<nav id="menu"></nav>

<section class="active">
    <h2>Seleccionar Estilo y Promociones</h2>

    <label>Cita Pendiente</label>
    <select id="estilo_cita">
        <option value="">Cargando citas...</option>
    </select>

    <label>Estilo Aplicado</label>
    <select id="estilo_estilo">
        <option value="">Cargando estilos...</option>
    </select>

    <label>Promoción Aplicada (Opcional)</label>
    <select id="estilo_promocion">
        <option value="">Ninguna / Cargando...</option>
    </select>

    <div class="actions">
        <button onclick="asignarEstiloPromocion()">Guardar Cambios</button>
    </div>
</section>
<script src="../js/script.js"></script>
</body>
</html>
